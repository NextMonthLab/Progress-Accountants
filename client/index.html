<!DOCTYPE html>
<html lang="en" style="background: black !important;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Accountants in Banbury | Progress Accountants – Real Tools for Business Growth</title>
    <meta name="description" content="Looking for an accountant in Banbury? Progress Accountants offers expert bookkeeping, tax returns, and a custom dashboard to grow your business. Book your free call today." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Force black background immediately to prevent blue flash */
      :root {
        --background: 0 0% 0% !important;
        --card: 0 0% 0% !important;
        --popover: 0 0% 0% !important;
        --muted: 0 0% 0% !important;
        --accent: 0 0% 0% !important;
        --secondary: 0 0% 0% !important;
      }
      
      /* Targeted override for loading background only */
      html, body, #root {
        background-color: black !important;
      }
      
      /* Ensure root elements always stay black */
      html { background: black !important; }
      body { background: black !important; }
      #root { background: black !important; }
    </style>
    <script>
      // Force black background immediately with JavaScript
      document.documentElement.style.backgroundColor = 'black';
      document.documentElement.style.setProperty('--background', '0 0% 0%', 'important');
      document.documentElement.style.setProperty('--card', '0 0% 0%', 'important');
      
      // Ensure it stays black as the page loads
      const observer = new MutationObserver(() => {
        document.documentElement.style.backgroundColor = 'black';
        document.body.style.backgroundColor = 'black';
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
    </script>
    <!-- Calendly widget styles and scripts -->
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
    
    <!-- NextMonth SmartSite Embed -->
    <script src="https://nextmonth-smart-sites-admin.replit.app/embed/chatbot.js?id=progress-accountants-uk-chatbot-1750317409747" data-tenant="progress-accountants-uk" 
            onload="console.log('NextMonth chatbot script loaded successfully')" 
            onerror="console.error('Failed to load NextMonth chatbot script')"></script>
    
    <!-- Fallback chatbot if external script fails -->
    <script>
      setTimeout(function() {
        // Check if NextMonth chatbot loaded successfully
        var existingWidget = document.getElementById('nextmonth-chat-widget') || 
                           document.querySelector('[id*="nextmonth"]') ||
                           document.querySelector('[class*="nextmonth"]') ||
                           document.querySelector('[data-chatbot]');
        
        if (!existingWidget && !window.NextMonthChatbot && !window.nextmonthChatbot) {
          console.log('External NextMonth chatbot not detected, creating fallback widget');
          
          // Create fallback chatbot
          var chatContainer = document.createElement('div');
          chatContainer.id = 'nextmonth-chat-widget-fallback';
          chatContainer.style.cssText = 
            'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; ' +
            'background: linear-gradient(135deg, #7B3FE4 0%, #3FA4E4 100%); ' +
            'border-radius: 50%; cursor: pointer; z-index: 9999; ' +
            'display: flex; align-items: center; justify-content: center; ' +
            'box-shadow: 0 4px 12px rgba(123, 63, 228, 0.3); ' +
            'transition: all 0.3s ease; opacity: 0.9;';
          
          chatContainer.innerHTML = 
            '<svg width="24" height="24" fill="white" viewBox="0 0 24 24">' +
            '<path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4l4 4 4-4h4c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>' +
            '</svg>';
          
          chatContainer.addEventListener('click', function() {
            // Create contact modal
            var modal = document.createElement('div');
            modal.style.cssText = 
              'position: fixed; top: 0; left: 0; width: 100%; height: 100%; ' +
              'background: rgba(0, 0, 0, 0.7); z-index: 10000; ' +
              'display: flex; align-items: center; justify-content: center;';
            
            var content = document.createElement('div');
            content.style.cssText = 
              'background: white; border-radius: 12px; padding: 30px; max-width: 400px; ' +
              'text-align: center; font-family: Arial, sans-serif; position: relative;';
            
            var closeBtn = document.createElement('button');
            closeBtn.innerHTML = '×';
            closeBtn.style.cssText = 
              'position: absolute; top: 10px; right: 15px; background: none; ' +
              'border: none; font-size: 24px; cursor: pointer; color: #666;';
            
            content.innerHTML = 
              '<h3 style="color: #333; margin-bottom: 20px;">Contact Progress Accountants</h3>' +
              '<p style="color: #666; margin-bottom: 25px;">Ready to speak with our accounting experts?</p>' +
              '<div style="display: flex; gap: 15px; justify-content: center;">' +
                '<a href="tel:01295477250" style="background: linear-gradient(135deg, #7B3FE4 0%, #3FA4E4 100%); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 500;">Call Now</a>' +
                '<a href="mailto:info@progressaccountants.co.uk" style="background: #f8f9fa; color: #333; border: 1px solid #e9ecef; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 500;">Email Us</a>' +
              '</div>';
            
            closeBtn.onclick = function() { document.body.removeChild(modal); };
            modal.onclick = function(e) { if (e.target === modal) document.body.removeChild(modal); };
            
            content.appendChild(closeBtn);
            modal.appendChild(content);
            document.body.appendChild(modal);
          });
          
          chatContainer.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.1)';
            this.style.opacity = '1';
          });
          
          chatContainer.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
            this.style.opacity = '0.9';
          });
          
          document.body.appendChild(chatContainer);
          console.log('Fallback NextMonth chatbot widget created and visible');
        } else {
          console.log('NextMonth chatbot detected - no fallback needed');
        }
      }, 2000);
    </script>
  </head>
  <body style="background-color: black; margin: 0; padding: 0;">
    <div id="root" style="background-color: black;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Calendly widget scripts -->
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
