<!DOCTYPE html>
<html lang="en" style="background: black !important;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Accountants in Banbury | Progress Accountants – Real Tools for Business Growth</title>
    <meta name="description" content="Looking for an accountant in Banbury? Progress Accountants offers expert bookkeeping, tax returns, and a custom dashboard to grow your business. Book your free call today." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      /* CSS Custom Properties for Responsive Design */
      :root {
        --background: 0 0% 0% !important;
        --card: 0 0% 0% !important;
        --popover: 0 0% 0% !important;
        --muted: 0 0% 0% !important;
        
        /* Responsive spacing variables */
        --spacing-xs: 0.5rem;
        --spacing-sm: 1rem;
        --spacing-md: 1.5rem;
        --spacing-lg: 2rem;
        --spacing-xl: 3rem;
        --spacing-2xl: 4rem;
        
        /* Typography scale */
        --text-xs: 0.75rem;
        --text-sm: 0.875rem;
        --text-base: 1rem;
        --text-lg: 1.125rem;
        --text-xl: 1.25rem;
        --text-2xl: 1.5rem;
        --text-3xl: 1.875rem;
        --text-4xl: 2.25rem;
        
        /* Container max-widths */
        --container-sm: 640px;
        --container-md: 768px;
        --container-lg: 1024px;
        --container-xl: 1280px;
        --container-2xl: 1536px;
        
        /* Color palette */
        --navy: #003865;
        --orange: #F27030;
      }
      
      /* Additional responsive styles */
      * {
        box-sizing: border-box;
      }
      
      html, body {
        overflow-x: hidden;
        scroll-behavior: smooth;
        width: 100%;
        max-width: 100vw;
      }
      
      /* Prevent layout shift and horizontal overflow */
      img, video {
        max-width: 100%;
        height: auto;
        object-fit: cover;
      }
      
      /* Universal container overflow protection */
      .container, .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl {
        max-width: 100%;
        overflow-x: hidden;
      }
      
      /* Button responsiveness with text containment */
      button, a[role="button"], .btn {
        min-height: 44px;
        min-width: clamp(100px, 25vw, 160px);
        padding-inline: clamp(0.75rem, 3vw, 1.5rem);
        font-size: clamp(0.875rem, 2.5vw, 1rem);
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
        transition: all 0.3s ease;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Hero section full-viewport optimization */
      .hero-full-screen {
        min-height: 100vh;
        min-height: 100dvh;
        background-attachment: fixed;
      }
      
      /* Mobile-specific hero optimizations */
      @media (max-width: 768px) {
        .hero-full-screen {
          background-attachment: scroll;
        }
      }
      
      /* High-resolution display optimizations */
      @media (min-width: 1920px) {
        .hero-content-ultra {
          max-width: 1600px;
        }
      }
      
      /* Touch-friendly interactions */
      @media (max-width: 768px) {
        button, a, [role="button"] {
          min-height: 44px;
          min-width: 44px;
          padding-inline: 1rem;
        }
      }
      
      /* Z-index management system */
      .z-header { z-index: 50; }
      .z-overlay { z-index: 40; }
      .z-badge { z-index: 30; }
      .z-cta { z-index: 20; }
      .z-content { z-index: 10; }
      
      /* Vertical rhythm consistency */
      section:last-child {
        margin-bottom: 0;
        padding-bottom: clamp(2rem, 5vw, 4rem);
      }
      
      /* Shadow standardization */
      .shadow-custom {
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
      }
      
      /* Smooth transitions for interactive elements */
      .interactive {
        transition: all 0.3s ease;
      }
      
      --secondary: 0 0% 0% !important;
      --accent: 0 0% 0% !important;
      
      /* Targeted override for loading background only */
      html, body, #root {
        background-color: black !important;
      }
      
      /* Ensure root elements always stay black */
      html { background: black !important; }
      body { background: black !important; }
      #root { background: black !important; }
    </style>
    <script>
      // Force black background immediately with JavaScript
      document.documentElement.style.backgroundColor = 'black';
      document.documentElement.style.setProperty('--background', '0 0% 0%', 'important');
      document.documentElement.style.setProperty('--card', '0 0% 0%', 'important');
      
      // Ensure it stays black as the page loads
      const observer = new MutationObserver(() => {
        document.documentElement.style.backgroundColor = 'black';
        document.body.style.backgroundColor = 'black';
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
    </script>
    <!-- Calendly widget styles and scripts -->
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">

  </head>
  <body style="background-color: black; margin: 0; padding: 0;">
    <div id="root" style="background-color: black;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Calendly widget scripts -->
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
